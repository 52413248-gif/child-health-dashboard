<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>儿童健康档案看板</title>
<style>
:root{--ink:#17332c;--muted:#6b7f78;--line:#dbe7e1;--paper:#f5f3ec;--card:#fffdf8;--green:#225b4b;--mint:#dfece5;--amber:#e9b769;--rose:#d98e86;--shadow:0 18px 50px rgba(27,63,52,.09)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1440px,calc(100% - 40px));margin:auto}.top{position:sticky;top:0;z-index:8;background:rgba(245,243,236,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(23,51,44,.08)}.topin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.03em}.brand small{font-weight:500;color:var(--muted);margin-left:10px}.actions,.filters{display:flex;gap:10px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.hero{padding:54px 0 26px;display:flex;align-items:end;justify-content:space-between;gap:24px}.hero h1{font-size:clamp(34px,5vw,66px);line-height:1;letter-spacing:-.055em;margin:0;max-width:1100px}.hero p{color:var(--muted);max-width:430px;margin:0 0 7px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}.stat{padding:24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat label{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:34px;margin-top:8px;letter-spacing:-.04em}.toolbar{display:flex;justify-content:space-between;gap:16px;margin:30px 0 14px}.search{min-width:280px}.field{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 13px;color:var(--ink)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--muted);text-align:left;padding:14px 16px;background:#eef3ef;white-space:nowrap}td{padding:16px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}.name{font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:5px}.note{max-width:300px;line-height:1.55}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--mint);font-size:12px;font-weight:700}.tag.warn{background:#f6e6c8}.tag.done{background:#e4ebe7;color:#6b7f78}.row-actions button{padding:6px 8px;background:transparent;color:var(--green)}.empty{text-align:center;padding:60px;color:var(--muted)}footer{padding:28px 0 46px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}dialog{border:0;border-radius:20px;padding:0;width:min(780px,calc(100% - 28px));box-shadow:0 30px 100px rgba(20,45,38,.28)}dialog::backdrop{background:rgba(18,35,30,.52);backdrop-filter:blur(3px)}.modal{padding:26px;background:var(--card)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal h2{margin:0;font-size:25px}.close{background:transparent;font-size:22px;padding:4px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.formgrid label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:7px}.span2{grid-column:span 2}.formgrid textarea{min-height:86px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.privacy{padding:12px 16px;background:#edf4ef;border-radius:11px;color:var(--muted);font-size:12px;margin-top:16px}.overdue{color:#a54d45;font-weight:800}@media(max-width:900px){.hero{align-items:start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.toolbar{flex-direction:column}.panel{overflow:auto}table{min-width:1050px}}@media(max-width:560px){.shell{width:min(100% - 24px,1440px)}.topin{height:auto;padding:12px 0;align-items:flex-start}.brand small{display:block;margin:3px 0}.top .secondary{display:none}.hero{padding-top:34px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)!important}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.search{min-width:0;width:100%}}
@media(max-width:700px){.topin{align-items:center}.top .actions{gap:8px}.top .secondary{display:none}.hero{padding:30px 0 20px}.hero h1{font-size:38px}.hero p{font-size:13px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:17px!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}.stat:nth-child(2n){border-right:0!important}.stat:nth-child(n+3){border-bottom:0!important}.stat strong{font-size:29px}.toolbar{margin-top:22px}.panel{background:transparent;border:0;box-shadow:none;overflow:visible}table{min-width:0!important}thead{display:none}tbody{display:grid;gap:14px}tr{display:grid;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}td{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}td:first-child{border-top:0;padding-top:0}td::before{color:var(--muted);font-size:12px;font-weight:700}td:nth-child(1)::before{content:'孩子 / 联系'}td:nth-child(2)::before{content:'首次体验'}td:nth-child(3)::before{content:'最近服务'}td:nth-child(4)::before{content:'服务记录'}td:nth-child(5)::before{content:'孩子状态'}td:nth-child(6)::before{content:'回访安排'}td:nth-child(7)::before{content:'跟进状态'}td:nth-child(8)::before{content:'操作'}.note{max-width:none}.row-actions{display:flex;justify-content:flex-end;align-items:center}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:20px 20px 0 0}.modal{padding:20px 16px 28px;max-height:92vh;overflow:auto}footer{display:grid;gap:5px}}
</style>
</head>
<body>
<header class="top"><div class="shell topin"><div class="brand">童安档案 <small>本地私密看板</small></div><div class="actions"><button class="secondary" id="resetBtn">重置为数据源</button><button class="secondary" id="exportBtn">导出 CSV</button><button class="primary" id="addBtn">新增档案</button></div></div></header>
<main class="shell"><section class="hero"><h1>儿童健康档案看板</h1><p>把每一次服务和回访放在一处，清晰记录孩子当下状态，也不错过下一次关心。</p></section>
<section class="stats"><div class="stat"><label>档案总数</label><strong id="total">0</strong></div><div class="stat"><label>待回访</label><strong id="pending">0</strong></div><div class="stat"><label>今日回访</label><strong id="today">0</strong></div><div class="stat"><label>逾期未回访</label><strong id="overdue">0</strong></div></section>
<section class="toolbar"><input class="field search" id="search" placeholder="搜索孩子姓名、电话、状态或记录"><div class="filters"><select class="field" id="statusFilter"><option value="">全部跟进状态</option><option>待回访</option><option>跟进中</option><option>已完成</option></select><select class="field" id="sort"><option value="follow">按回访时间</option><option value="first">按首次体验日期</option><option value="name">按孩子姓名</option></select></div></section>
<section class="panel"><table><thead><tr><th>孩子 / 联系</th><th>首次体验</th><th>最近服务</th><th>服务记录</th><th>孩子状态</th><th>回访安排</th><th>跟进</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>没有找到匹配的档案</div></section>
<footer><span>数据仅保存在本机浏览器</span><span id="updated"></span></footer></main>
<dialog id="dialog"><form class="modal" id="form"><div class="modalhead"><h2 id="modalTitle">新增儿童档案</h2><button type="button" class="close" id="closeBtn" aria-label="关闭">×</button></div><input type="hidden" name="_index"><div class="formgrid">
<label>孩子姓名 *<input class="field" required name="孩子姓名"></label><label>家长电话 *<input class="field" required name="家长电话" inputmode="tel"></label><label>首次体验日期 *<input class="field" required type="date" name="首次体验日期"></label><label>服务日期<input class="field" type="date" name="服务日期"></label><label>服务项目<input class="field" name="服务项目"></label><label>服务人员<input class="field" name="服务人员"></label><label class="span2">服务记录 *<textarea class="field" required name="服务记录"></textarea></label><label>孩子状态 *<input class="field" required name="孩子状态" placeholder="例：精神良好 / 观察中"></label><label>回访时间<input class="field" type="datetime-local" name="回访时间"></label><label>跟进状态<select class="field" name="跟进状态"><option>待回访</option><option>跟进中</option><option>已完成</option></select></label><label>备注<input class="field" name="备注"></label></div><div class="privacy">请在获得家长同意后记录，避免填写与服务无关的敏感信息。</div><div class="modalfoot"><button type="button" class="secondary" id="cancelBtn">取消</button><button class="primary" type="submit">保存档案</button></div></form></dialog>
<script>
/*__DATA_START__*/
const SOURCE_DATA = [];
/*__DATA_END__*/
const KEY='childHealthDashboard_v1',fields=['孩子姓名','家长电话','首次体验日期','服务日期','服务项目','服务记录','孩子状态','回访时间','跟进状态','服务人员','备注'];let data=JSON.parse(localStorage.getItem(KEY)||'null')||SOURCE_DATA.map(x=>({...x}));const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function mask(s){s=String(s||'');return s.length>=7?s.slice(0,3)+'****'+s.slice(-4):s}function localDate(s){if(!s)return'—';return String(s).replace('T',' ')}function isToday(s){if(!s)return false;const d=new Date(s),n=new Date;return d.toDateString()===n.toDateString()}function isOverdue(r){return r['跟进状态']!=='已完成'&&r['回访时间']&&new Date(r['回访时间'])<new Date}function render(){const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value,sort=$('#sort').value;let rows=data.map((r,i)=>({...r,_i:i})).filter(r=>(!sf||r['跟进状态']===sf)&&(!q||fields.some(f=>String(r[f]||'').toLowerCase().includes(q))));rows.sort((a,b)=>sort==='name'?a['孩子姓名'].localeCompare(b['孩子姓名'],'zh'):String(a[sort==='first'?'首次体验日期':'回访时间']||'9999').localeCompare(String(b[sort==='first'?'首次体验日期':'回访时间']||'9999')));$('#total').textContent=data.length;$('#pending').textContent=data.filter(r=>r['跟进状态']!=='已完成').length;$('#today').textContent=data.filter(r=>isToday(r['回访时间'])).length;$('#overdue').textContent=data.filter(isOverdue).length;$('#empty').hidden=rows.length>0;$('#tbody').innerHTML=rows.map(r=>`<tr><td><div class="name">${esc(r['孩子姓名'])}</div><div class="sub">${esc(mask(r['家长电话']))}</div></td><td>${esc(localDate(r['首次体验日期']))}</td><td>${esc(localDate(r['服务日期']))}<div class="sub">${esc(r['服务项目'])} · ${esc(r['服务人员'])}</div></td><td class="note">${esc(r['服务记录'])}<div class="sub">${esc(r['备注'])}</div></td><td><span class="tag">${esc(r['孩子状态']||'未记录')}</span></td><td class="${isOverdue(r)?'overdue':''}">${esc(localDate(r['回访时间']))}</td><td><span class="tag ${r['跟进状态']==='已完成'?'done':'warn'}">${esc(r['跟进状态']||'待回访')}</span></td><td class="row-actions"><button onclick="editRow(${r._i})">编辑</button><button onclick="removeRow(${r._i})">删除</button></td></tr>`).join('');$('#updated').textContent='最近查看 '+new Date().toLocaleString('zh-CN',{hour12:false})}function openForm(i){$('#form').reset();$('#form').elements._index.value=i??'';$('#modalTitle').textContent=i==null?'新增儿童档案':'编辑儿童档案';if(i!=null)fields.forEach(f=>$('#form').elements[f].value=(data[i][f]||'').replace(' ','T'));$('#dialog').showModal()}window.editRow=openForm;window.removeRow=i=>{if(confirm('确定删除该档案吗？')){data.splice(i,1);save()}};$('#form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),obj={};fields.forEach(f=>obj[f]=fd.get(f)||'');const i=fd.get('_index');if(i==='')data.unshift(obj);else data[+i]=obj;save();$('#dialog').close()};$('#addBtn').onclick=()=>openForm();$('#closeBtn').onclick=$('#cancelBtn').onclick=()=>$('#dialog').close();['search','statusFilter','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#resetBtn').onclick=()=>{if(confirm('将浏览器内的手动数据替换为 data.csv 的当前数据？')){data=SOURCE_DATA.map(x=>({...x}));save()}};$('#exportBtn').onclick=()=>{const csv='\ufeff'+[fields,...data.map(r=>fields.map(f=>String(r[f]||'').replace(/"/g,'""')))].map(row=>row.map(v=>'"'+v+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='儿童健康档案_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
